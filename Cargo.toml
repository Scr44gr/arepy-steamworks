[package]
name = "arepy-steamworks"
version = "0.1.0"
edition = "2021"
description = "Steamworks integration for Arepy ECS game engine"
license = "MIT"

[lib]
name = "arepy_steamworks"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28.3", features = ["extension-module"] }
steamworks = "0.13.1"
thiserror = "2.0"
