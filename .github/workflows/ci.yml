name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v8

      - name: Install dependencies
        run: uv sync

      - name: Run ruff check
        run: uv run ruff check python/ tests/ examples/

      - name: Run ruff format check
        run: uv run ruff format --check python/ tests/ examples/

      - name: Run cargo fmt check
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run pytest
        run: uv run pytest tests/ -v -rs

  build-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1.51.0
        with:
          maturin-version: v1.13.3
          manylinux: 2_28
          args: >-
            --release --out dist
            -i ${{ startsWith(matrix.os, 'ubuntu') && format('python{0}', matrix.python-version) || 'python' }}
            --compatibility pypi

      - name: Validate wheel archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheel = next(Path('dist').glob('*.whl'))
          data = wheel.read_bytes()
          search_start = max(0, len(data) - (65_535 + 22))
          eocd_offset = data.rfind(b'PK\x05\x06', search_start)
          if not data.startswith(b'PK\x03\x04'):
              raise SystemExit(f'Wheel has unexpected leading data: {wheel.name}')
          if eocd_offset == -1:
              raise SystemExit(f'Wheel is missing an end-of-central-directory record: {wheel.name}')

          comment_length = int.from_bytes(data[eocd_offset + 20 : eocd_offset + 22], 'little')
          if comment_length != 0 or eocd_offset + 22 + comment_length != len(data):
              raise SystemExit(f'Wheel has trailing data or ZIP comments: {wheel.name}')

          with zipfile.ZipFile(wheel) as archive:
              bad_member = archive.testzip()
              if bad_member is not None:
                  raise SystemExit(f'Corrupt wheel member in {wheel.name}: {bad_member}')

          print(f'Validated {wheel.name}')
          PY

      - name: Smoke test built wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --force-reinstall dist/*.whl
          python - <<'PY'
          import arepy_steamworks

          assert hasattr(arepy_steamworks, 'SteamResource')
          print('Imported arepy_steamworks successfully')
          PY
