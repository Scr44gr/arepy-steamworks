[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "arepy_steamworks"
dynamic = ["version"]
description = "Steamworks integration for Arepy ECS game engine"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
authors = [{ name = "Abrahan", email = "scr44gr@protonmail.com" }]

[project.urls]
Homepage = "https://github.com/scr44gr/arepy-steamworks"
Repository = "https://github.com/scr44gr/arepy-steamworks"
Issues = "https://github.com/scr44gr/arepy-steamworks/issues"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8", "maturin>=1.0,<2.0"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "arepy_steamworks._native"
exclude = ["steam_api*.dll", "libsteam_api.*"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T10",  # flake8-debugger
    "EM",   # flake8-errmsg
    "ISC",  # flake8-implicit-str-concat
    "G",    # flake8-logging-format
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "TD",   # flake8-todos
    "ERA",  # eradicate
    "PL",   # pylint
    "TRY",  # tryceratops
    "FLY",  # flynt
    "PERF", # perflint
    "RUF",  # ruff-specific rules
    "ANN",  # flake8-annotations
    "D",    # pydocstyle
]
ignore = [
    "D100",    # Missing docstring in public module
    "D104",    # Missing docstring in public package
    "PLR0913", # Too many arguments in function definition
    "PLR2004", # Magic value used in comparison
    "TRY003",  # Avoid specifying long messages outside the exception class
]


[tool.ruff.pydocstyle]
convention = "google"

[tool.ruff.per-file-ignores]
"tests/**/*.py" = [
    "D101",    # Missing docstring in public class
    "D102",    # Missing docstring in public method
    "D103",    # Missing docstring in public function
    "ANN201",  # Missing return type annotation
    "PLR2004", # Magic value used in comparison
]
"examples/**/*.py" = [
    "D103", # Missing docstring in public function
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.flake8-annotations]
allow-star-arg-any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--strict-markers", "--strict-config", "-v"]
